# 掌上台球 - 生产部署（腾讯云 Lighthouse / Docker CE）
# 单容器：Node 服务端同时提供静态托管 + WebSocket 权威模拟（零运行时依赖）
# 端口规划：与捡红点（80/2567）、干瞪眼（8080/2568）共存，本应用使用 8081
services:
  billiards:
    build: .
    container_name: billiards-server
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      PORT: "8080"
